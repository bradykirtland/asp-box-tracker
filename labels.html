<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASP Box Tracker — Barcode Labels</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
  :root { --bg:#f4f5f7; --ink:#1d2433; --muted:#6b7280; --line:#e5e7eb; --accent:#1e3a8a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--accent); color:#fff; padding:16px 24px; display:flex; align-items:center; justify-content:space-between; }
  header h1 { margin:0; font-size:20px; }
  header a { color:#c7d2fe; text-decoration:none; font-size:14px; }
  .bar { max-width:1000px; margin:0 auto; padding:18px 24px; display:flex; gap:12px; align-items:center; }
  .bar p { margin:0; color:var(--muted); font-size:14px; }
  button { font:inherit; cursor:pointer; border:1px solid var(--accent); background:var(--accent); color:#fff; padding:9px 16px; border-radius:9px; font-weight:600; }
  .grid { max-width:1000px; margin:0 auto; padding:0 24px 40px; display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .label { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; text-align:center; }
  .label .dims { font-size:18px; font-weight:700; margin-bottom:2px; }
  .label .station { font-size:12px; color:var(--muted); margin-bottom:6px; }
  .label svg { max-width:100%; height:auto; }
  .note { max-width:1000px; margin:0 auto 10px; padding:0 24px; color:var(--muted); font-size:13px; }
  @media print {
    header, .bar { display:none; }
    body { background:#fff; }
    .grid { grid-template-columns:repeat(3,1fr); gap:10px; padding:0; }
    .label { border:1px dashed #bbb; break-inside:avoid; }
  }
</style>
</head>
<body>
<header>
  <h1>🏷️ Box Barcode Labels</h1>
  <a href="/">← Tracker</a>
</header>
<div class="bar">
  <button onclick="window.print()">🖨️ Print</button>
  <p>One label per box <b>per station</b>. Print, cut out, and stick each on its bin at that station. Scanning a label opens that box at that station.</p>
</div>
<div class="note" id="note"></div>
<div class="grid" id="grid"></div>

<script>
async function api(action, payload) {
  const res = await fetch('/api', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ action, ...(payload||{}) }) });
  return res.json();
}
function escapeHtml(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function boxLen(d){ const m=(d||'').match(/\d+(\.\d+)?/g); return m&&m.length?Number(m[0]):Infinity; }

(async () => {
  const grid = document.getElementById('grid');
  const note = document.getElementById('note');
  // Make sure every box×station has a barcode (generates the missing ones).
  try { await api('ensureStationBarcodes'); } catch (e) {}
  let s;
  try { s = await api('getState'); } catch (e) { note.textContent = 'Could not load boxes: ' + e; return; }

  const boxes = (s.boxTypes || []).slice().sort((a,b) => boxLen(a.dimensions) - boxLen(b.dimensions));
  const areas = s.areas || [];
  const bc = {};
  (s.barcodes || []).forEach(b => { bc[b.typeId + ':' + b.areaId] = b.barcode; });
  if (!boxes.length || !areas.length) { note.textContent = 'No boxes/areas yet.'; return; }

  // One label per box per station, encoding that station's barcode.
  let i = 0, count = 0;
  boxes.forEach(t => {
    areas.forEach(a => {
      const value = bc[t.id + ':' + a.id];
      if (!value) return;
      const id = 'bc' + (i++);
      const cell = document.createElement('div');
      cell.className = 'label';
      cell.innerHTML = `<div class="dims">${escapeHtml(t.dimensions)}</div>
                        <div class="station">${escapeHtml(a.name)}</div>
                        <svg id="${id}"></svg>`;
      grid.appendChild(cell);
      try {
        JsBarcode('#' + id, value, { format: 'CODE128', displayValue: true, fontSize: 13, height: 48, margin: 6 });
      } catch (e) {
        cell.innerHTML += `<div style="color:#dc2626;font-size:12px;">barcode error</div>`;
      }
      count++;
    });
  });
  note.textContent = count + ' labels — ' + boxes.length + ' box size(s) × ' + areas.length + ' station(s).';
})();
</script>
</body>
</html>
