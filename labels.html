<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASP Box Tracker — QR Labels</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  :root { --bg:#f4f5f7; --ink:#1d2433; --muted:#6b7280; --line:#e5e7eb; --accent:#1e3a8a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--accent); color:#fff; padding:16px 24px; display:flex; align-items:center; justify-content:space-between; }
  header h1 { margin:0; font-size:20px; }
  header a { color:#c7d2fe; text-decoration:none; font-size:14px; }
  .bar { max-width:1000px; margin:0 auto; padding:18px 24px; display:flex; gap:12px; align-items:center; }
  .bar p { margin:0; color:var(--muted); font-size:14px; }
  button { font:inherit; cursor:pointer; border:1px solid var(--accent); background:var(--accent); color:#fff; padding:9px 16px; border-radius:9px; font-weight:600; }
  .grid { max-width:1000px; margin:0 auto; padding:0 24px 40px; display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .label { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; text-align:center; }
  .label .dims { font-size:18px; font-weight:700; margin-bottom:2px; }
  .label .station { font-size:12px; color:var(--muted); margin-bottom:8px; }
  .label .qr { display:flex; justify-content:center; margin-bottom:6px; }
  .label .qr img, .label .qr canvas { width:120px; height:120px; }
  .label .code { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .note { max-width:1000px; margin:0 auto 10px; padding:0 24px; color:var(--muted); font-size:13px; }
  @media print {
    header, .bar { display:none; }
    body { background:#fff; }
    .grid { grid-template-columns:repeat(3,1fr); gap:10px; padding:0; }
    .label { border:1px dashed #bbb; break-inside:avoid; }
  }
</style>
</head>
<body>
<header>
  <h1>🏷️ Box QR Labels</h1>
  <a href="/">← Tracker</a>
</header>
<div class="bar">
  <button onclick="window.print()">🖨️ Print</button>
  <p>One label per box <b>per station</b>. Print, cut out, and stick each on its bin at that station. Scanning a label opens that box at that station.</p>
</div>
<div class="note" id="note"></div>
<div class="grid" id="grid"></div>

<script>
async function api(action, payload) {
  const res = await fetch('/api', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ action, ...(payload||{}) }) });
  return res.json();
}
function escapeHtml(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function boxLen(d){ const m=(d||'').match(/\d+(\.\d+)?/g); return m&&m.length?Number(m[0]):Infinity; }

(async () => {
  const grid = document.getElementById('grid');
  const note = document.getElementById('note');
  // Make sure every box×station has a barcode (generates the missing ones).
  try { await api('ensureStationBarcodes'); } catch (e) {}
  let s;
  try { s = await api('getState'); } catch (e) { note.textContent = 'Could not load boxes: ' + e; return; }

  const boxes = (s.boxTypes || []).slice().sort((a,b) => boxLen(a.dimensions) - boxLen(b.dimensions));
  const areas = s.areas || [];
  const bc = {};
  (s.barcodes || []).forEach(b => { bc[b.typeId + ':' + b.areaId] = b.barcode; });
  if (!boxes.length || !areas.length) { note.textContent = 'No boxes/areas yet.'; return; }

  // One QR label per box per station, encoding that station's code.
  function makeQR(cell, id, value) {
    try {
      new QRCode(document.getElementById(id), {
        text: value, width: 120, height: 120,
        correctLevel: QRCode.CorrectLevel.M,
      });
    } catch (e) {
      cell.innerHTML += `<div style="color:#dc2626;font-size:12px;">QR error</div>`;
    }
  }
  let i = 0, count = 0;
  boxes.forEach(t => {
    areas.forEach(a => {
      const value = bc[t.id + ':' + a.id];
      if (!value) return;
      const id = 'qr' + (i++);
      const cell = document.createElement('div');
      cell.className = 'label';
      cell.innerHTML = `<div class="dims">${escapeHtml(t.dimensions)}</div>
                        <div class="station">${escapeHtml(a.name)}</div>
                        <div class="qr" id="${id}"></div>
                        <div class="code">${escapeHtml(value)}</div>`;
      grid.appendChild(cell);
      makeQR(cell, id, value);
      count++;
    });
  });
  // Order labels (ORD-<id>) — scan on arrival to fill into the Box Area.
  let orders = [];
  try { orders = (await api('listOrders')).orders || []; } catch (e) {}
  if (orders.length) {
    const h = document.createElement('div');
    h.style.cssText = 'grid-column:1/-1; font-weight:700; margin:18px 0 4px; border-top:1px solid var(--line); padding-top:14px;';
    h.textContent = 'Order labels — scan when the shipment arrives';
    grid.appendChild(h);
    orders.forEach(o => {
      const id = 'qr' + (i++);
      const cell = document.createElement('div');
      cell.className = 'label';
      cell.innerHTML = `<div class="dims">${escapeHtml(o.name || ('Order ' + o.id))}</div>
                        <div class="station">${o.lines.map(l => escapeHtml(l.dimensions) + '×' + l.qty).join(', ') || '(empty)'}</div>
                        <div class="qr" id="${id}"></div>
                        <div class="code">${escapeHtml(o.barcode)}</div>`;
      grid.appendChild(cell);
      makeQR(cell, id, o.barcode);
    });
  }
  note.textContent = count + ' box labels (' + boxes.length + '×' + areas.length + ')'
    + (orders.length ? ' + ' + orders.length + ' order label(s)' : '') + '.';
})();
</script>
</body>
</html>
