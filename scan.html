<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASP Box Tracker — Scan</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --ink: #1d2433; --muted: #6b7280;
    --line: #e5e7eb; --accent: #1e3a8a; --accent-soft: #eef2ff;
    --danger: #dc2626; --green: #16a34a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink);
  }
  header {
    background: var(--accent); color: #fff; padding: 16px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { margin: 0; font-size: 20px; }
  header a { color: #c7d2fe; text-decoration: none; font-size: 14px; }
  main { max-width: 820px; margin: 0 auto; padding: 22px; }

  .scan-box {
    background: var(--card); border: 2px solid var(--accent); border-radius: 14px;
    padding: 16px 18px; margin-bottom: 18px;
  }
  .scan-box label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  #code {
    width: 100%; font-size: 26px; padding: 14px 16px; border: 1px solid var(--line);
    border-radius: 10px; font-variant-numeric: tabular-nums; letter-spacing: .5px;
  }
  #code:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .focus-note { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .focus-note.warn { color: var(--danger); font-weight: 600; }

  .toast {
    margin-bottom: 16px; padding: 12px 16px; border-radius: 10px; font-size: 15px;
    background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46;
  }
  .toast.err { background: #fef2f2; border-color: #fecaca; color: var(--danger); }

  .box-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .box-head { padding: 18px 22px; background: var(--accent-soft); border-bottom: 1px solid var(--line); }
  .box-dims { font-size: 38px; font-weight: 800; letter-spacing: .5px; }
  .box-sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .box-sub .low { color: var(--danger); font-weight: 700; }

  .locs { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  @media (max-width: 620px) { .locs { grid-template-columns: 1fr; } }
  .loc { padding: 18px 22px; border-top: 1px solid var(--line); }
  .loc + .loc { border-left: 1px solid var(--line); }
  @media (max-width: 620px) { .loc + .loc { border-left: none; } }
  .loc-name { font-size: 14px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .loc-qty { font-size: 52px; font-weight: 800; line-height: 1.05; margin: 4px 0 12px; font-variant-numeric: tabular-nums; }
  .loc-qty.zero { color: var(--danger); }
  .loc-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .take-amt { width: 64px; font: inherit; font-size: 18px; text-align: center; padding: 8px; border: 1px solid var(--line); border-radius: 8px; }
  button {
    font: inherit; cursor: pointer; border: 1px solid var(--line); background: #fff;
    padding: 10px 16px; border-radius: 10px; font-weight: 600;
  }
  button.take { background: var(--danger); color: #fff; border-color: var(--danger); }
  button.add { background: var(--green); color: #fff; border-color: var(--green); }
  button:active { transform: translateY(1px); }

  .unknown { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
  .unknown h2 { margin: 0 0 6px; font-size: 18px; color: var(--danger); }
  .unknown p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .unknown code { background: var(--bg); padding: 2px 7px; border-radius: 5px; }
  .unknown select { font: inherit; font-size: 16px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; }
  .placeholder { color: var(--muted); text-align: center; padding: 50px 0; font-size: 16px; }
</style>
</head>
<body>
<header>
  <h1>📷 Scan Box</h1>
  <a href="/">← Tracker</a>
</header>

<main>
  <div class="scan-box">
    <label for="code">Scan a box barcode (or type it and press Enter)</label>
    <input id="code" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text" placeholder="Waiting for scan…">
    <div class="focus-note" id="focusNote">Ready to scan.</div>
  </div>

  <div id="toast"></div>
  <div id="result">
    <div class="placeholder">Scan a barcode to see the box and its stock at both locations.</div>
  </div>
</main>

<script>
let boxTypes = [];        // for the "link unknown barcode" dropdown
let currentType = null;   // the box currently shown
let currentCode = '';     // the code that produced it

async function api(action, payload) {
  const res = await fetch('/api', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, ...(payload || {}) }),
  });
  const data = await res.json();
  if (data && data.error) throw new Error(data.error);
  return data;
}

const codeInput = document.getElementById('code');
const resultEl = document.getElementById('result');
const toastEl = document.getElementById('toast');

function escapeHtml(s) {
  return (s == null ? '' : String(s)).replace(/[&<>"']/g,
    c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function toast(msg, kind) {
  toastEl.innerHTML = msg ? `<div class="toast ${kind || ''}">${escapeHtml(msg)}</div>` : '';
}

// Keep the input focused so the scanner's keystrokes always land here.
function keepFocus() { codeInput.focus(); }
codeInput.addEventListener('blur', () => setTimeout(keepFocus, 50));
document.addEventListener('click', (e) => {
  // don't steal focus from buttons/selects the user is using
  if (!e.target.closest('button, select, input')) keepFocus();
});

// A scan ends with Enter — that's our trigger.
codeInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const code = codeInput.value.trim();
    codeInput.value = '';
    if (code) doLookup(code);
  }
});

async function doLookup(code) {
  currentCode = code;
  try {
    const res = await api('lookupBarcode', { code });
    renderResult(res);
  } catch (e) {
    toast('Lookup failed: ' + e.message, 'err');
  }
  keepFocus();
}

function renderResult(res) {
  if (!res.found) {
    currentType = null;
    renderUnknown(res.code);
    return;
  }
  currentType = res.type;
  toast('');

  const reorder = (res.type.reorderAt != null && res.total <= res.type.reorderAt)
    ? `<span class="low"> · ⚠️ at/under reorder level (${res.type.reorderAt})</span>` : '';

  const locs = res.areas.map(a => `
    <div class="loc" data-area="${a.id}">
      <div class="loc-name">${escapeHtml(a.name)}</div>
      <div class="loc-qty ${a.qty === 0 ? 'zero' : ''}">${a.qty}</div>
      <div class="loc-controls">
        <input class="take-amt" type="number" min="1" value="1" inputmode="numeric">
        <button class="take" data-area="${a.id}">Take</button>
        <button class="add" data-area="${a.id}">Add</button>
      </div>
    </div>
  `).join('');

  resultEl.innerHTML = `
    <div class="box-card">
      <div class="box-head">
        <div class="box-dims">${escapeHtml(res.type.dimensions)}</div>
        <div class="box-sub">${res.total} in stock total${reorder}</div>
      </div>
      <div class="locs">${locs}</div>
    </div>
  `;
}

function renderUnknown(code) {
  const options = boxTypes.slice()
    .sort((a, b) => (a.dimensions || '').localeCompare(b.dimensions || ''))
    .map(t => `<option value="${t.id}">${escapeHtml(t.dimensions)}</option>`).join('');
  resultEl.innerHTML = `
    <div class="unknown">
      <h2>Unknown barcode</h2>
      <p>No box is linked to <code>${escapeHtml(code)}</code> yet. Pick the box this barcode belongs to and link it — future scans will recognize it.</p>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        <select id="linkSelect">${options}</select>
        <button class="add" id="linkBtn" style="background:var(--accent);border-color:var(--accent);">Link barcode</button>
      </div>
    </div>
  `;
  document.getElementById('linkBtn').onclick = linkBarcode;
}

async function linkBarcode() {
  const typeId = Number(document.getElementById('linkSelect').value);
  if (!typeId) return;
  try {
    await api('setBarcode', { typeId, barcode: currentCode });
    toast('Barcode linked. Looking it up…');
    await doLookup(currentCode);
  } catch (e) {
    toast('Could not link: ' + e.message, 'err');
  }
}

// Take / Add buttons (event delegation)
resultEl.addEventListener('click', async (e) => {
  const btn = e.target.closest('button.take, button.add');
  if (!btn || !currentType) return;
  const loc = btn.closest('.loc');
  const areaId = Number(btn.dataset.area);
  const amtEl = loc.querySelector('.take-amt');
  let amt = parseInt(amtEl.value, 10);
  if (!Number.isInteger(amt) || amt < 1) amt = 1;
  const delta = btn.classList.contains('take') ? -amt : amt;
  const areaName = loc.querySelector('.loc-name').textContent;
  try {
    await api('adjustQty', { areaId, typeId: currentType.id, delta });
    const verb = delta < 0 ? 'Took' : 'Added';
    toast(`${verb} ${Math.abs(delta)} × ${currentType.dimensions} ${delta < 0 ? 'from' : 'to'} ${areaName}.`);
    await doLookup(currentCode);   // refresh both locations from the server
  } catch (e) {
    toast('Update failed: ' + e.message, 'err');
  }
  keepFocus();
});

// Load box list (for the link dropdown) and grab focus.
(async () => {
  try { const s = await api('getState'); boxTypes = s.boxTypes || []; } catch {}
  keepFocus();
})();
</script>
</body>
</html>
